<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lightroom v5</title>
<style>
:root{--bg:#131315;--pn:#1b1b1e;--ln:#2c2c30;--tx:#e6e6e8;--mu:#8b8b93;--ac:#6cb8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
button,select{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;min-height:40px}
button:active{background:var(--ln)}button:disabled{opacity:.35}
header{display:flex;gap:6px;padding:6px 8px;align-items:center;border-bottom:1px solid var(--ln);position:relative;z-index:20}
header button,header label{flex:none}
.pri{background:var(--ac);color:#06121f;border-color:var(--ac);font-weight:600}
#ul{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:8px;background:var(--pn);border:1px solid var(--ln)}
#load{cursor:pointer}
#wrap{flex:1;min-height:34vh;position:relative;overflow:hidden;z-index:0;display:flex;align-items:center;justify-content:center;background:#000;touch-action:none}
#stage{position:relative}
#stage canvas,#stage svg{position:absolute;inset:0;width:100%;height:100%}#stage svg{pointer-events:none;overflow:visible}
#empty{position:absolute;color:var(--mu);text-align:center;padding:20px}
#cgrow{display:flex;align-items:center;gap:6px}#cgrow #cgw{flex:1 1 0;min-width:0;width:auto;max-width:220px}
#cgt{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}#cgt button{position:relative;width:44px;height:44px;min-height:0;padding:0;border:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center}#cgt button:nth-child(4),#cgt button:nth-child(5){margin-top:14px}#cgt button:nth-child(4)::before,#cgt button:nth-child(5)::before{content:'';position:absolute;top:-11px;left:12px;right:12px;height:1px;background:#777}
#cgt .rg{stroke:#bdbdbd;stroke-width:3.5}#cgt .on .rg{stroke:#fff;stroke-width:6;r:16.5px}
#wb{gap:4px}#wb button{flex:none;min-width:0;width:44px;height:44px;min-height:0;padding:0;border:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center}#wb button.pri{background:none;color:var(--ac)}
#mdl{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}#mdl.on{opacity:1;visibility:visible}
#mdlc{width:min(420px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--ln);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);overflow:hidden}
#mdlh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;border-bottom:1px solid var(--ln)}#mdlh b{font-size:16px}
#mdlx{width:40px;height:40px;min-height:0;padding:0;border:0;border-radius:50%;background:none;font-size:20px;line-height:1}
#mdll{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.mdi{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid var(--ln);background:none}.mdi b{font-size:15px}.mdi span{font-size:13px;color:var(--mu)}.mdi.on{border-color:var(--ac)}
#mdlf{display:flex;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--ln)}#mdlf button{min-width:96px}
#mcomp.bar{flex-direction:column;flex-wrap:nowrap;gap:6px}.crow{display:flex;align-items:center;border:1px solid var(--ln);border-radius:10px;background:var(--pn)}.crow.on{border-color:var(--ac);color:var(--ac)}.crow.off .cn{opacity:.45}
#mcomp .crow button{flex:none;min-width:0;min-height:44px;padding:0 12px;border:0;border-radius:0;background:none;display:inline-flex;align-items:center}#mcomp .crow button.cn{flex:1;justify-content:flex-start;text-align:left}.crow svg{display:block}.crow .sp{flex:0 0 40px}
.csub{margin-left:22px;display:flex;flex-direction:column;gap:6px}.csub .crow{position:relative}
.csub .crow::before{content:'';position:absolute;left:-14px;top:-6px;bottom:50%;width:12px;border-left:2px solid var(--ln);border-bottom:2px solid var(--ln);border-bottom-left-radius:8px;pointer-events:none}
.csub .crow.nl::after{content:'';position:absolute;left:-14px;top:50%;bottom:-6px;border-left:2px solid var(--ln);pointer-events:none}
.mi.mc,.mi.mv{display:flex;align-items:center;justify-content:center}.mi svg{display:block}
.mc .cv{width:9px;height:9px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin-top:-4px}.mc .cv.op{transform:rotate(-135deg);margin-top:4px}
#hist{position:absolute;left:8px;bottom:8px;width:110px;height:40px;background:rgba(0,0,0,.5);border-radius:6px;pointer-events:none}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ac);color:#06121f;padding:6px 14px;border-radius:20px;font-weight:600;display:none;pointer-events:none}
#chbar{display:flex;align-items:stretch;border-top:1px solid var(--ln);background:var(--pn)}#chips{flex:1;min-width:0;display:flex;gap:6px;padding:6px 8px;overflow-x:auto}
#chlab{display:none;flex:1;min-width:0;padding:0 12px;line-height:28px;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chtg{flex:0 0 44px;min-height:0;padding:0;border:0;border-left:1px solid var(--ln);border-radius:0;background:none;display:flex;align-items:center;justify-content:center}
#chtg b{width:9px;height:9px;border-left:2px solid var(--mu);border-top:2px solid var(--mu);transform:rotate(45deg);margin-top:4px}
#side.chc #chips{display:none}#side.chc #chlab{display:block}#side.chc #chtg{flex-basis:44px;min-height:28px}#side.chc #chtg b{transform:rotate(225deg);margin-top:-4px}
.btnl{flex:1;min-width:30%;display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:40px;padding:8px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);cursor:pointer}
.chip{flex:none;display:flex;align-items:center;min-height:38px;padding:0 2px;border:1px solid var(--ln);border-radius:19px;background:var(--pn)}
.chip button{background:none;border:0;border-radius:0;min-height:36px;padding:0 8px;display:inline-flex;align-items:center}.chip .cn{padding:0 8px}.chip svg{display:block}
.sh{margin:14px 0 6px;color:var(--tx)}
.chip.on{border-color:var(--ac);color:var(--ac)}.chip.off .cn{opacity:.45}
#tabs{display:flex;background:var(--pn);border-bottom:1px solid var(--ln)}
#tabs button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;min-height:44px}
#tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
#panel,#wfwin{height:36vh;overflow-y:auto;padding:10px 16px 20px;background:var(--pn)}#wfwin{display:none}#side.wf #wfwin{display:block}#side.wf #panel{display:none}
#wfh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}#wfh b{font-size:15px}#wfx{width:40px;height:40px;min-height:0;padding:0;border:0;border-radius:50%;background:none;font-size:20px;line-height:1}
.row{margin:0 0 12px}.row .t{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:2px;user-select:none}
.row .v{color:var(--ac);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none;touch-action:pan-y}
@property --tr{syntax:'<percentage>';inherits:false;initial-value:100%}
input[type=range].dn::-webkit-slider-thumb{--tr:55%}input[type=range].dn::-moz-range-thumb{--tr:55%}
input[type=range]{--p0:50%;--p1:50%;--tb:#555}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--tb) 0,var(--tb) var(--p0),#fff var(--p0),#fff var(--p1),var(--tb) var(--p1),var(--tb) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:28px;height:28px;margin-top:-12.5px;border-radius:50%;background:radial-gradient(circle closest-side,#1c1c1c var(--tr),#fff calc(var(--tr) + 1px));border:2.5px solid #fff;pointer-events:auto;transition:--tr .4s ease}
input[type=range]::-moz-range-track{height:3px;background:linear-gradient(90deg,var(--tb) 0,var(--tb) var(--p0),#fff var(--p0),#fff var(--p1),var(--tb) var(--p1),var(--tb) 100%)}
input[type=range]::-moz-range-thumb{box-sizing:border-box;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle closest-side,#1c1c1c var(--tr),#fff calc(var(--tr) + 1px));border:2.5px solid #fff;pointer-events:auto;transition:--tr .4s ease}
.dots{display:flex;gap:10px;margin-bottom:14px}.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;min-height:0}.dot.on{border-color:#fff;transform:scale(1.15)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar button,.bar select{flex:1;min-width:30%}
.note{color:var(--mu);font-size:13px;margin:0 0 12px}
#grip{width:100%;min-height:26px;padding:0;border:0;border-top:1px solid var(--ln);border-radius:0;background:var(--pn);display:flex;align-items:center;justify-content:center}
#grip b{width:9px;height:9px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin-top:-4px}
#side.col #grip b{transform:rotate(-135deg);margin-top:4px}#side.col #panel,#side.col #chbar,#side.col #wfwin{display:none}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-bottom:1px solid var(--ln);margin-bottom:8px}.sw input{width:22px;height:22px;accent-color:var(--ac)}
input.rb::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(0 100% 50%),hsl(60 100% 50%),hsl(120 100% 50%),hsl(180 100% 50%),hsl(240 100% 50%),hsl(300 100% 50%),hsl(360 100% 50%))}
input.sg::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#777,var(--hc,#f00))}
input.rb::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(0 100% 50%),hsl(60 100% 50%),hsl(120 100% 50%),hsl(180 100% 50%),hsl(240 100% 50%),hsl(300 100% 50%),hsl(360 100% 50%))}
input.sg::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#777,var(--hc,#f00))}
input.rb::-webkit-slider-thumb,input.sg::-webkit-slider-thumb{margin-top:-10px;box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}
input.rb::-moz-range-thumb,input.sg::-moz-range-thumb{box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}
.bar button.on{border-color:var(--ac);color:var(--ac)}
.fbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg)}
input[type=color]{width:46px;height:34px;padding:0;border:1px solid var(--ln);background:none;border-radius:6px}
.sw select{min-width:130px}
.wheel{position:relative;width:min(220px,86%);aspect-ratio:1;margin:68px auto 48px;touch-action:pan-y;border-radius:50%;cursor:crosshair}.wheel .hz{position:absolute;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;touch-action:none;z-index:2}
.wheel canvas,.wheel svg{position:absolute;inset:0;width:100%;height:100%}.wheel svg{overflow:visible;pointer-events:none}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.pgrid button{width:42px;height:42px;min-height:0;padding:0;border-radius:8px;border:2px solid var(--ln)}.pgrid button.on{border-color:#fff;transform:scale(1.1)}
.fsec{margin-top:20px;padding-top:14px;border-top:1px solid var(--ln)}
#tabs{overflow-x:auto}#tabs button{flex:1 0 auto;padding:8px 14px}
.mod{border:1px solid var(--ln);border-radius:10px;margin-bottom:10px;overflow:hidden}.mh{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--bg)}
.mh .mn{flex:1;font-weight:600;padding:8px 4px}.mi{min-width:36px;min-height:36px;padding:0 6px;border:0;background:none}.mb{padding:10px 12px 2px}
#zc{position:absolute;right:8px;top:8px;display:flex;gap:6px}#zc button{min-height:38px;min-width:38px;padding:0 10px;background:rgba(20,20,22,.75)}
#stage{transform-origin:50% 50%}
#grip,#chbar,#tabs,#panel,#wfwin{position:relative;z-index:2}
.ib{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;min-height:0;padding:0;border-radius:10px;background:var(--pn);border:1px solid var(--ln);color:var(--tx)}
#dlw{position:relative}#dlm{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;gap:4px;min-width:160px;padding:6px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:30}
#dlm button{text-align:left;border:0;background:none;min-height:42px}#dlm button:active{background:var(--ln)}
.hid{display:none!important}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9}
@media(min-width:800px){body{flex-direction:row;flex-wrap:wrap}header{width:100%}#wrap{flex:1 1 60%;height:calc(100% - 56px)}#side{flex:0 0 380px;display:flex;flex-direction:column;height:calc(100% - 56px)}#panel,#wfwin{flex:1;height:auto}}
#side{display:contents}@media(min-width:800px){#side{display:flex}}
#cst{display:flex;margin:-10px -16px 14px;background:var(--pn);border-bottom:1px solid var(--ln);}#cst button{flex:1;position:relative;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;min-height:44px;min-width:0}#cst button.on{color:var(--ac);border-bottom-color:var(--ac)}#cst button+button::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--ln)}
.sx{display:none!important}</style></head><body>
<header>
<label id="load" class="ib" aria-label="開啟照片"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7.5a2 2 0 0 0-1.9 1.4L3 18z"/><path d="M3 18l2.6-7.6A2 2 0 0 1 7.5 9H22l-2.6 8.2a2 2 0 0 1-1.9 1.4H3z"/></svg><input id="file" type="file" accept="image/*" hidden></label>
<button id="undo" class="ib" aria-label="復原" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button><button id="redo" class="ib" aria-label="重做" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg></button>
<span style="flex:1"></span>
<div id="dlw"><button id="dlb" class="ib" aria-label="下載"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button><div id="dlm" class="hid"><button data-dl="png">下載 PNG</button><button data-dl="jpeg">下載 JPG</button><button data-dl="json">下載設定檔</button></div></div>
<select id="fmt" class="hid"><option value="png">PNG</option><option value="jpeg">JPEG 92</option></select><button id="exp" class="hid"></button><button id="dl" class="hid"></button>
</header>
<div id="wrap"><div id="empty">開啟一張照片開始修圖<br>設定可用「下載設定」存成 JSON，之後再上傳套用</div>
<div id="stage" class="hid"><canvas id="gl"></canvas><svg id="o" xmlns="http://www.w3.org/2000/svg"></svg></div>
<canvas id="hist" width="110" height="40"></canvas><div id="zc"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zfit" aria-label="符合畫面">1×</button></div><div id="hint">在照片上拖曳建立遮罩</div></div>
<div id="side"><button id="grip" aria-label="收合或展開調整面板"><b></b></button>
<div id="chbar"><div id="chips"></div><div id="chlab"></div><button id="chtg" aria-label="收起或展開遮罩圖層列" aria-expanded="true"><b></b></button></div>
<div id="tabs"><button data-t="light" class="on">光線</button><button data-t="color">顏色</button><button data-t="mask">遮罩</button><button data-t="ef">效果</button><button data-t="crop">裁切</button><button data-t="fn">功能</button></div>
<div id="panel">
<div class="hid" id="cst"><button data-s="base" class="on">基礎</button><button data-s="hsl">HSL 混色</button><button data-s="cg">色彩分級</button></div>
<div id="p-light"></div><div id="p-color" class="hid"><div class="bar" id="wb"><button id="wbe" title="吸管取中性色" aria-label="吸管取中性色"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5a2.1 2.1 0 0 0-3 0l-3 3-1-1-2 2 1 1-7 7V19h4.5l7-7 1 1 2-2-1-1 3-3a2.1 2.1 0 0 0 0-3z"/></svg></button><button id="wba" title="自動" aria-label="自動"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button></div></div>
<div id="p-hsl" class="hid"><div class="dots" id="dots"></div></div>
<div id="p-ef" class="hid"><div id="mods"></div>
<div class="bar"><button id="addmod" class="pri">＋ 新增效果</button></div>
<p class="note">效果由上到下依序套用，可以新增多個相同的效果。每個效果都要自己上傳一張深度圖（白色=近、黑色=遠）才能調整。</p></div>
<div id="p-crop" class="hid"><p class="note">拖曳角落調整範圍，拖曳框內移動位置。傾斜時範圍會自動縮小，避免露出空白。</p>
<div class="pgrid" id="crat" style="gap:6px"></div>
<div class="row"><div class="t"><span>傾斜</span><span class="v" id="ctv">0°</span></div><input type="range" id="ctilt" min="-450" max="450" value="0"></div>
<div class="bar"><button id="cswap">橫直互換</button><button id="crst">重設裁切</button></div></div>
<div id="p-fn" class="hid">
<div class="bar"><button id="cmp">按住看原圖</button><button id="rst">全部重設</button><label class="btnl">上傳設定<input id="jf" type="file" accept=".json,application/json" hidden></label></div>
<label class="sw"><span>顯示色階分布圖</span><input type="checkbox" id="fh" checked></label>
<label class="sw"><span>全螢幕模式</span><input type="checkbox" id="fsw"></label><p class="note" id="fsn" style="margin-top:-4px"></p>

<div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--ln)"><p class="note"><b>色彩調色盤</b>　拖曳色輪選基準色，依配色規則產生 5 個顏色</p>
<select id="phm" style="width:100%"><option value="analogous">類似色 Analogous</option><option value="complementary">互補色 Complementary</option><option value="triad">三等分 Triad</option><option value="split">分裂互補 Split complementary</option><option value="tetrad">四角 Tetradic</option><option value="mono">單色 Monochromatic</option></select>
<div id="pw"></div><div id="prd" class="note" style="text-align:center;margin:0 0 6px"></div>
<div class="pgrid" id="pgen"></div>
<div class="bar"><button id="padd" class="pri">全部加入調色盤</button></div>
<p class="note" style="margin-top:14px"><b>我的調色盤</b>　（會一併存進設定檔）</p><div class="pgrid" id="pcus"></div><p class="note" id="pcn"></p>
<div class="bar"><button id="pbase">設為基準色</button><button id="pdel">刪除</button><button id="pclr">清空</button></div></div></div>

$('#dlb').onclick=e=>{e.stopPropagation();$('#dlm').classList.toggle('hid')};
document.addEventListener('click',e=>{if(!e.target.closest('#dlw'))$('#dlm').classList.add('hid')});
document.querySelectorAll('#dlm button').forEach(b=>b.onclick=()=>{$('#dlm').classList.add('hid');const t=b.dataset.dl;if(t=='json')$('#dl').click();else{$('#fmt').value=t;$('#exp').click()}});
$('#chtg').onclick=()=>{const c=$('#side').classList.toggle('chc');$('#chtg').setAttribute('aria-expanded',!c)};
$('#grip').onclick=()=>$('#side').classList.toggle('col');
$('#minv').onclick=()=>{ac().inv^=1;syncAll();render();commit()};
const cmp=$('#cmp');cmp.onpointerdown=()=>{off=1;draw(false)};['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,()=>{if(off){off=0;draw(false)}}));
// 載入與匯出
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f||!gl)return;
try{const lim=Math.min(4096,gl.getParameter(gl.MAX_TEXTURE_SIZE));let b=await createImageBitmap(f,{imageOrientation:'from-image'});
const s=Math.min(1,lim/Math.max(b.width,b.height));if(s<1){const w=Math.round(b.width*s),h=Math.round(b.height*s);b.close();b=await createImageBitmap(f,{imageOrientation:'from-image',resizeWidth:w,resizeHeight:h,resizeQuality:'high'})}
bmp=b;oc=document.createElement('canvas');const os=Math.min(1,512/Math.max(b.width,b.height));oc.width=Math.max(1,Math.round(b.width*os));oc.height=Math.max(1,Math.round(b.height*os));oc.getContext('2d',{willReadFrequently:true}).drawImage(b,0,0,oc.width,oc.height);iw=b.width;ih=b.height;$('#gl').width=iw;$('#gl').height=ih;gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bmp);
syncFx();clearMods();modRender();focusPick=null;cropReset();zm.z=1;zm.x=zm.y=0;zApply();vw=0;vh=0;L=[mk('全圖')];cur=0;band=0;pend=null;wbOff();hist=[snap()];hi=0;chips();syncAll();btns();
$('#empty').classList.add('hid');stage.classList.remove('hid');fit();rebuildBrush()}catch(err){alert('無法開啟這張照片：'+err.message)}e.target.value=''};
$('#exp').onclick=()=>{if(!bmp)return;const o=$('#ov');o.style.display='flex';const t=$('#fmt').value;
setTimeout(()=>{draw(true);$('#gl').toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='lr5_'+Date.now()+(t=='png'?'.png':'.jpg');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);o.style.display='none';draw(false)},'image/'+t,.92)},50)};
// 設定檔
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'lr5',version:1,layers:L,fx,palette:pal.cols,mods,crop:bmp?{cx:crop.cx/iw,cy:crop.cy/ih,hw:crop.hw/iw,hh:crop.hh/ih,a:crop.a,ratio:crop.ratio,rk:crop.rk}:null},null,1)],{type:'application/json'}));a.download='lr5_settings_'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const num=(v,d,a,b)=>typeof v=='number'&&isFinite(v)?cl(v,a,b):d;
function fillComp(c,x){c.ch=x.ch?1:0;c.type=TY[x.type]!=null?x.type:'linear';c.hue=num(x.hue,-1,-1,360);c.sat=num(x.sat,0,0,1);c.lum=num(x.lum,-1,-1,1);c.range=num(x.range,50,0,100);
c.strokes=(Array.isArray(x.strokes)?x.strokes:[]).slice(0,400).map(t=>({e:t&&t.e?1:0,r:num(t&&t.r,.03,.001,.3),s:num(t&&t.s,.5,0,1),p:(Array.isArray(t&&t.p)?t.p:[]).slice(0,8000).map(a=>[num(a&&a[0],0,0,1),num(a&&a[1],0,0,1)])}));
['x1','y1','x2','y2'].forEach(k=>c[k]=num(x[k],c[k],0,1));c.ang=num(x.ang,0,-7,7);c.feather=num(x.feather,50,0,100);c.inv=x.inv?1:0;c.img=(typeof x.img=='string'&&x.img.startsWith('data:image/')&&x.img.length<600000)?x.img:''}
function clean(x,i){const m=mk(i?(typeof x.name=='string'?x.name.slice(0,20):'遮罩 '+i):'全圖'),p=x.p||{};
Object.keys(m.p).forEach(k=>m.p[k]=num(p[k],m.p[k],-100,100));
if(Array.isArray(x.hsl))m.hsl=m.hsl.map((h,j)=>[0,1,2].map(k=>num(x.hsl[j]&&x.hsl[j][k],0,-100,100)));
if(!i){m.hcol=/^#[0-9a-f]{6}$/i.test(x.hcol)?x.hcol:m.hcol;m.hmode=Math.round(num(x.hmode,0,0,5));m.hinv=x.hinv?1:0;{const q=m.hcol,[a,b,c]=hslJS(parseInt(q.slice(1,3),16)/255,parseInt(q.slice(3,5),16)/255,parseInt(q.slice(5,7),16)/255);m.hh=num(x.hh,a,0,360);m.hs=num(x.hs,b*100,0,100);m.hl=num(x.hl,c*100,0,100);m.hcol=hzHex(m.hh,m.hs,m.hl)}}
m.cgb=num(x.cgb,0,-100,100);if(Array.isArray(x.cgr)){const a=num(x.cgr[0],25,1,90),b=num(x.cgr[1],75,a+4,99);m.cgr=[a,b]}
if(Array.isArray(x.cg))m.cg=m.cg.map((r,j)=>{const a=x.cg[j]||[];return[num(a[0],0,0,360),num(a[1],0,0,100),num(a[2],0,-100,100),num(a[3],r[3],0,100)]});
if(i){m.vis=x.vis?1:0;fillComp(m,x);m.amt=num(x.amt,100,0,100);m.ci=0;m.extra=(Array.isArray(x.extra)?x.extra:[]).slice(0,4).map(e=>{const c=mkComp('linear',e&&e.op);fillComp(c,e||{});return c})}return m}
$('#jf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
try{const d=JSON.parse(await f.text());if(!d||d.app!='lr5'||!Array.isArray(d.layers)||!d.layers.length)throw new Error('不是這個程式匯出的設定檔');
if(Array.isArray(d.palette)){pal.cols=d.palette.filter(c=>typeof c=='string'&&/^#[0-9a-f]{6}$/i.test(c)).map(c=>c.toLowerCase()).filter((c,i,a)=>a.indexOf(c)==i).slice(0,30);pal.sel=-1;palRender()}
if(Array.isArray(d.mods)){clearMods();d.mods.slice(0,40).forEach(x=>{if(!x||!MD[x.type])return;const m=newMod(x.type),df=MD[x.type]();Object.keys(df).forEach(k=>{if(k!='A')m[k]=num(x[k],df[k],-100,360)});
m.mode=m.mode===undefined?undefined:Math.round(cl(m.mode,0,5));if(m.mode===undefined)delete m.mode;m.inv=x.inv?1:0;m.on=x.on===0?0:1;mods.push(m)});modRender();if(mods.length){hint('效果需要重新上傳深度圖');setTimeout(()=>hint(''),3000)}}
if(d.crop&&bmp){const c=d.crop;crop.cx=num(c.cx,.5,0,1)*iw;crop.cy=num(c.cy,.5,0,1)*ih;crop.hw=Math.max(8,num(c.hw,.5,0,1)*iw);crop.hh=Math.max(8,num(c.hh,.5,0,1)*ih);crop.a=num(c.a,0,-.8,.8);crop.ratio=num(c.ratio,0,0,20);crop.rk=Math.round(num(c.rk,0,-1,8));fitCrop();cropUI()}
if(d.fx){fx.hist=d.fx.hist===0?0:1;syncFx()}L=d.layers.slice(0,200).map(clean);cur=0;band=0;wbOff();commit();chips();syncAll();rebuildBrush()}catch(err){alert('無法載入設定：'+err.message)}};
// 啟動
try{localStorage.removeItem(KEY)}catch(e){}
hist=[snap()];hi=0;chips();syncAll();btns();
</script><script>
/* Lightroom-style slider fill: bright segment between 0 (or min) and current value */
(function(){const upd=i=>{if(i.classList.contains('rb')||i.classList.contains('sg'))return;
const mn=+i.min,mx=+i.max,v=+i.value,z=mn<0&&mx>0?0:mn,f=x=>(x-mn)/(mx-mn||1),a=f(z),b=f(v);
const L=x=>`calc(14px + (100% - 28px)*${x})`,lo=Math.min(a,b),hi=Math.max(a,b);i.style.setProperty('--p0',z==mn?'0px':L(lo));i.style.setProperty('--p1',L(hi));i._lv=i.value};
document.addEventListener('input',e=>{if(e.target.type=='range')upd(e.target)},true);
(function loop(){document.querySelectorAll('input[type=range]').forEach(i=>{if(i._lv!==i.value||i._mn!==i.min||i._mx!==i.max){i._mn=i.min;i._mx=i.max;upd(i)}});requestAnimationFrame(loop)})()})();
</script>
